name: Weekly Sanity backup

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export Sanity dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          mkdir -p backups
          npx --yes @sanity/cli dataset export production "backups/production-$(date +%F).tar.gz" \
            --project-id q1cdy4k7 \
            --overwrite

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "chore: weekly Sanity dataset backup"
          git push
